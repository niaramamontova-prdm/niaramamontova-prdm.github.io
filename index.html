<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Niara Mamontova</title>
  <link rel="icon" type="image/png" href="./assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, sans-serif;
      background: #E8EFEB;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.10);
      padding: 56px 48px;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 24px;
      border: 3px solid #E8EFEB;
    }
    h1 { font-size: 26px; font-weight: 700; color: #111827; margin-bottom: 6px; }
    .subtitle { font-size: 15px; color: #6B7280; margin-bottom: 40px; }
    .btn-group { display: flex; flex-direction: column; gap: 14px; }
    .btn {
      display: block;
      padding: 18px 28px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-pm {
      background: linear-gradient(135deg, rgba(0,150,255,0.12), rgba(0,200,170,0.12));
      color: #0F766E;
      border: 2px solid rgba(15,118,110,0.2);
    }
    .btn-pm:hover {
      background: linear-gradient(135deg, rgba(0,150,255,0.22), rgba(0,200,170,0.22));
      border-color: #0F766E;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .btn-tpm {
      background: linear-gradient(135deg, rgba(0,90,180,0.10), rgba(0,150,220,0.10));
      color: #1d4ed8;
      border: 2px solid rgba(29,78,216,0.2);
    }
    .btn-tpm:hover {
      background: linear-gradient(135deg, rgba(0,90,180,0.20), rgba(0,150,220,0.20));
      border-color: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .btn-label { font-size: 12px; font-weight: 400; opacity: 0.7; margin-top: 4px; display: block; }
    .footer-note { margin-top: 32px; font-size: 13px; color: #9CA3AF; }
    .footer-note a { color: #0F766E; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <img src="./assets/avatar.jpg" alt="Niara Mamontova" class="avatar" />
    <h1>Niara (Nia) Mamontova</h1>
    <p class="subtitle">Irvine, California &nbsp;·&nbsp; FinTech · SaaS · Payments · AI Platforms</p>

    <div class="btn-group">
      <a href="./prdm/" class="btn btn-pm">
        Product Manager / Product Owner
        <span class="btn-label">Enterprise SaaS · Identity · Payments · AI</span>
      </a>

    </div>

    <p class="footer-note">
      <a href="https://www.linkedin.com/in/niaramamontova/" target="_blank">LinkedIn</a>
      &nbsp;·&nbsp;
      <a href="mailto:niara.mamontova@gmail.com">niara.mamontova@gmail.com</a>
    </p>
  </div>
</body>
</html>
